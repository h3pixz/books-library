<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Books Library</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1 class="app-title">Books Library</h1>
        <p class="app-tagline">Search books by title and save your favorites.</p>
        <div class="theme-toggle">
          <button id="theme-toggle-btn" type="button" class="theme-toggle__button">Dark theme</button>
        </div>
        <form id="search-form" class="search-form" novalidate>
          <label class="visually-hidden" for="search-input">Search by title</label>
          <input id="search-input" type="search" name="query" placeholder="Search by book title..." autocomplete="off" />
          <button type="submit">Find</button>
        </form>
        <p class="search-hint">Tip: results update automatically as you type.</p>
      </header>

      <main class="app-main">
        <section id="results-section" class="section">
          <h2 class="section-title">Search results</h2>
          <label class="visually-hidden" for="author-filter">Filter by author</label>
          <select id="author-filter" class="author-filter" hidden>
            <option value="">All authors</option>
          </select>
          <div id="results-container" class="cards-container"></div>
        </section>

        <section id="favorites-section" class="section section--favorites">
          <h2 class="section-title">Favorites</h2>
          <div id="favorites-container" class="cards-container"></div>
        </section>
      </main>

      <footer class="app-footer">
        <p>Powered by the Open Library API</p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
